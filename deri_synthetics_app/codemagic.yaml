workflows:
  deriv_synthetics_android:
    name: Deriv Synthetics Android APK
    max_build_duration: 60
    instance_type: linux_x2   # Linux = Android only

    environment:
      flutter: stable

    scripts:
      - name: Flutter Doctor
        script: flutter doctor -v

      - name: Clean
        script: flutter clean

      - name: Get Dependencies
        script: flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release
          echo "Listing APK files:"
          ls build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
