workflows:
  deriv_synthetics_android:
    name: Deriv Synthetics Android APK
    max_build_duration: 60
    instance_type: linux_x2   # ANDROID ONLY (no mac, no iOS)

    environment:
      flutter: stable

    scripts:
      - name: Flutter doctor
        script: flutter doctor -v

      - name: Clean
        script: flutter clean

      - name: Get dependencies
        script: flutter pub get

      - name: Build APK (Android only)
        script: |
          flutter build apk --release
          ls build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
