workflows:
  deriv_synthetics_android:
    name: Deriv Synthetics Android APK
    max_build_duration: 60
    instance_type: linux_x2   # Android only, no Xcode

    environment:
      flutter: stable

    scripts:
      - name: Flutter Doctor
        script: flutter doctor -v

      - name: Clean Project
        script: flutter clean

      - name: Get Dependencies
        script: flutter pub get

      - name: Build APK (Release)
        script: |
          flutter build apk --release
          echo "APK build complete. Listing files:"
          ls build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/*.apk   # <- ensures APK shows in Codemagic

    publishing:
      email:
        recipients:
          - your_email@example.com   # replace with your email
        notify:
          success: true
          failure: true
